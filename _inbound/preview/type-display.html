<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:24px;}
  .card{width:660px;}
  .eyebrow{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--spring-green);margin-bottom:10px;}
  .display{font-family:var(--font-decorative);font-size:52px;color:var(--spring-green);line-height:1;margin-bottom:8px;}
  .h1{font-family:var(--font-heading);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-0.025em;margin:0;}
  .h1 em{font-style:normal;color:var(--spring-green);}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Display · Cherry Bomb + Outfit</div>
  <div class="display">bring the joy.</div>
  <h1 class="h1">The system wasn't built<br>for the <em>60% in the middle.</em></h1>
</div>
</body>
</html>
