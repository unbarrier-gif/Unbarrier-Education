<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:22px;}
  .card{width:660px;display:flex;gap:10px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;}
  .soon{background:rgba(255,138,28,0.15);border:1px solid rgba(255,138,28,0.3);color:#ff8a1c;}
  .live{background:rgba(56,255,153,0.15);border:1px solid rgba(56,255,153,0.3);color:#38ff99;}
  .tag{background:var(--surface-raised);border:1px solid var(--border-default);color:var(--text-muted);letter-spacing:0.02em;text-transform:none;font-family:var(--font-body);font-weight:600;font-size:12px;}
  .payoff{background:var(--school-bus-yellow);color:var(--amethyst);padding:6px 14px;border-radius:8px;font-family:var(--font-heading);font-weight:800;letter-spacing:-0.01em;text-transform:none;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <span class="chip soon">In build</span>
  <span class="chip live">Live now</span>
  <span class="chip tag">Apple PLS</span>
  <span class="chip tag">Student voice</span>
  <span class="chip tag">iPad strategy</span>
  <span class="payoff">£10 / session</span>
  <span class="payoff" style="background:#38ff99;">Founding member · £20/mo</span>
</div>
</body>
</html>
