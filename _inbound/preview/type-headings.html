<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:24px;}
  .card{width:660px;display:flex;flex-direction:column;gap:16px;}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-subtle);padding-bottom:14px;}
  .row:last-child{border-bottom:none;}
  .meta{width:120px;flex-shrink:0;font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-subtle);}
  .sample{font-family:var(--font-heading);color:var(--text);margin:0;letter-spacing:-0.025em;font-weight:800;}
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="meta">H1 · 800</div><h1 class="sample" style="font-size:42px;line-height:1.05;">Pick your starting point</h1></div>
  <div class="row"><div class="meta">H2 · 800</div><h2 class="sample" style="font-size:30px;line-height:1.08;">Not sure where to start?</h2></div>
  <div class="row"><div class="meta">H3 · 700</div><h3 class="sample" style="font-size:20px;line-height:1.2;font-weight:700;">What I believe</h3></div>
  <div class="row"><div class="meta">H4 · 700</div><h4 class="sample" style="font-size:15px;line-height:1.3;font-weight:700;letter-spacing:0;">unbarrier.audit</h4></div>
</div>
</body>
</html>
