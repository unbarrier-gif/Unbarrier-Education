<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:24px;}
  .card{width:660px;display:flex;flex-direction:column;gap:12px;}
  .label{font-family:var(--font-heading);font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-subtle);}
  .stack{display:flex;flex-direction:column;gap:4px;font-family:var(--font-body);color:var(--text);}
  .a{font-family:"Outfit",sans-serif;font-weight:700;font-size:24px;letter-spacing:-0.02em;}
  .b{font-family:"Comfortaa",sans-serif;font-weight:500;font-size:20px;}
  .c{font-family:"Cherry Bomb One",cursive;font-size:32px;color:var(--spring-green);line-height:1;}
  .note{font-family:var(--font-body);font-size:12px;color:var(--text-subtle);}
</style>
</head>
<body>
<div class="card">
  <div class="stack"><div class="label">Heading · Outfit · 100–900</div><div class="a">Outfit — tight, confident, modern</div></div>
  <div class="stack"><div class="label">Body · Comfortaa · 300–700</div><div class="b">Comfortaa — rounded, warm, accessible</div></div>
  <div class="stack"><div class="label">Decorative · Cherry Bomb One · one moment only</div><div class="c">bring the joy.</div></div>
  <div class="note">Three families. Two sizes of permission. Use decorative sparingly — one appearance per screen, max.</div>
</div>
</body>
</html>
