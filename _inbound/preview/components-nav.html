<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:18px;}
  .card{width:660px;}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:rgba(33,10,51,0.82);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;}
  .wordmark{font-family:'Comfortaa',system-ui,sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.012em;color:var(--text);white-space:nowrap;text-decoration:none;}
  .wordmark .dot{color:var(--spring-green);}
  .links{display:flex;gap:22px;align-items:center;}
  .link{font-family:var(--font-heading);font-size:13px;font-weight:500;color:rgba(240,235,229,0.6);letter-spacing:0.02em;text-decoration:none;}
  .link:hover{color:var(--text);}
  .cta{font-family:var(--font-body);font-weight:700;font-size:12.5px;background:var(--spring-green);color:var(--amethyst);padding:7px 16px;border-radius:100px;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="nav">
    <a class="wordmark" href="#">unbarrier<span class="dot">.</span>me</a>
    <div class="links">
      <a class="link">audit</a>
      <a class="link">access</a>
      <a class="link">voice</a>
      <a class="link">blog</a>
      <a class="link">about</a>
      <a class="cta" href="#">Email Nici</a>
    </div>
  </div>
</div>
</body>
</html>
