<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:22px;}
  .card{width:660px;display:flex;flex-direction:column;gap:0;}
  .belief{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border-default);}
  .belief:last-child{border-bottom:none;}
  .arrow{color:var(--spring-green);font-family:var(--font-heading);font-weight:700;font-size:16px;flex-shrink:0;}
  .txt{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.65;color:var(--text-muted);}
  .eyebrow{font-family:var(--font-heading);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--orchid-mist);margin-bottom:12px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">What I believe</div>
  <div class="belief"><span class="arrow">→</span><p class="txt">Belonging and psychological safety come before any tool, curriculum, or strategy.</p></div>
  <div class="belief"><span class="arrow">→</span><p class="txt">The barrier is never the child. The system needs to flex around the student — not the other way round.</p></div>
  <div class="belief"><span class="arrow">→</span><p class="txt">Buying a device for a SEND student without a strategy isn't inclusion. It's a tick-box.</p></div>
</div>
</body>
</html>
