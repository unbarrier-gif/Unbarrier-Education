<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--amethyst);color:var(--text);}
  body{padding:20px;}
  .card{width:660px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .input{flex:1;min-width:220px;font-family:var(--font-body);font-size:14px;background:var(--surface-raised);border:1.5px solid var(--border-default);color:var(--text);padding:12px 16px;border-radius:12px;outline:none;}
  .input::placeholder{color:var(--text-subtle);}
  .input:focus{border-color:var(--spring-green);}
  .btn{background:var(--spring-green);color:var(--amethyst);padding:12px 22px;border-radius:100px;font-family:var(--font-body);font-weight:700;font-size:14px;border:none;cursor:pointer;}
  .check{display:flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:13px;color:var(--text-muted);}
  .box{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border-strong);background:var(--spring-green);display:flex;align-items:center;justify-content:center;color:var(--amethyst);font-weight:900;font-size:12px;}
</style>
</head>
<body>
<div class="card">
  <input class="input" placeholder="nici@unbarrier.me">
  <button class="btn">Email Nici →</button>
  <label class="check"><span class="box">✓</span> Keep me in the loop</label>
</div>
</body>
</html>
