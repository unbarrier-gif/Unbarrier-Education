document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en-GB\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Legal Pages v1 · Unbarrier<\u002Ftitle>\n\n<style>/* ========================================================================\n   Unbarrier Design System — Colors & Type\n   Single source of truth. Import this in every prototype.\n   ======================================================================== */\n\n/* ── FONTS ──────────────────────────────────────────────────────────────── */\n@font-face {\n  font-family: \"Outfit\";\n  src: url(\"63ef8e1f-1b20-4589-9352-4f229181107b\") format(\"truetype-variations\");\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Comfortaa\";\n  src: url(\"f4a95424-0480-4572-a7c4-81250a1f8cc2\") format(\"truetype-variations\");\n  font-weight: 300 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: \"Cherry Bomb One\";\n  src: url(\"460edaea-adec-4a9f-b595-1850d144a3e1\") format(\"truetype\");\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ── CORE BRAND COLORS ─────────────────────────────────────────────── */\n  --amethyst:          #210a33;   /* page background, structure         */\n  --amethyst-deep:     #150520;   /* deeper pockets, contrast wells     */\n  --antique-white:     #fceddb;   /* warm cream accent, text alt        */\n  --text:              #f0ebe5;   /* primary text on amethyst           */\n\n  /* Brand accent palette — vibrant, each maps to a service */\n  --spring-green:      #38ff99;   /* primary action, CTA, hero highlight */\n  --pearl-aqua:        #69d9d1;   /* unbarrier.audit — calm, evidence    */\n  --princeton-orange:  #ff8a1c;   /* unbarrier.access — premium, energy  */\n  --orchid-mist:       #db7dcc;   /* unbarrier.voice / Nici — human      */\n  --school-bus-yellow: #ffc203;   /* payoff, community, Loop Breakers    */\n  --pink-mist:         #e3a1b0;   /* supporting soft accent              */\n\n  /* ── FUNCTIONAL TEXT/BORDER TOKENS ─────────────────────────────────── */\n  --text-muted:     rgba(240, 235, 229, 0.65);\n  --text-subtle:    rgba(240, 235, 229, 0.45);\n  --text-faint:     rgba(240, 235, 229, 0.32);\n  --text-inverse:   #210a33;     /* for text on green/yellow bg        */\n\n  --border-default: rgba(255, 255, 255, 0.08);\n  --border-subtle:  rgba(255, 255, 255, 0.05);\n  --border-strong:  rgba(255, 255, 255, 0.18);\n\n  --surface-raised: rgba(255, 255, 255, 0.03);\n  --surface-lift:   rgba(255, 255, 255, 0.06);\n\n  /* ── SEMANTIC ROLES ────────────────────────────────────────────────── */\n  --bg:               var(--amethyst);\n  --bg-alt:           var(--amethyst-deep);\n  --fg:               var(--text);\n  --fg-muted:         var(--text-muted);\n  --action:           var(--spring-green);\n  --action-fg:        var(--amethyst);\n  --payoff:           var(--school-bus-yellow);\n  --human:            var(--orchid-mist);\n  --quiet:            var(--pearl-aqua);\n  --premium:          var(--princeton-orange);\n\n  /* Focus ring */\n  --focus-ring:       var(--spring-green);\n\n  /* ── TYPE FAMILIES ─────────────────────────────────────────────────── */\n  --font-heading:     \"Outfit\", system-ui, -apple-system, sans-serif;\n  --font-body:        \"Comfortaa\", system-ui, -apple-system, sans-serif;\n  --font-brand:       \"Comfortaa\", system-ui, sans-serif;    /* logo wordmark */\n  --font-decorative:  \"Cherry Bomb One\", \"Outfit\", cursive;  /* \"bring the joy\" only */\n\n  /* ── TYPE SCALE ────────────────────────────────────────────────────── */\n  --fs-display: clamp(3rem, 7vw, 4.5rem);   /* hero */\n  --fs-h1:      clamp(2.4rem, 6vw, 4rem);\n  --fs-h2:      clamp(1.8rem, 3.5vw, 2.8rem);\n  --fs-h3:      clamp(1.3rem, 2.4vw, 1.75rem);\n  --fs-h4:      clamp(1.05rem, 1.8vw, 1.25rem);\n  --fs-body:    1rem;\n  --fs-body-lg: 1.1rem;\n  --fs-small:   0.88rem;\n  --fs-eyebrow: 0.72rem;\n  --fs-caption: 0.78rem;\n\n  --lh-tight:   1.06;\n  --lh-snug:    1.3;\n  --lh-body:    1.75;\n  --lh-loose:   1.85;\n\n  --ls-tight:   -0.025em;\n  --ls-normal:  0;\n  --ls-loose:   0.04em;\n  --ls-eyebrow: 0.14em;\n\n  /* ── SPACING & RADII ───────────────────────────────────────────────── */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-8:  48px;\n  --space-10: 64px;\n  --space-12: 96px;\n\n  --radius-sm:    6px;\n  --radius-md:    12px;   /* site default */\n  --radius-lg:    18px;\n  --radius-xl:    24px;\n  --radius-pill:  100px;\n\n  /* ── ELEVATION ─────────────────────────────────────────────────────── */\n  --shadow-sm:   0 1px 2px rgba(0,0,0,0.25);\n  --shadow-md:   0 6px 20px rgba(0,0,0,0.3);\n  --shadow-lg:   0 20px 50px rgba(0,0,0,0.4);\n  --glow-green:  0 0 40px rgba(56, 255, 153, 0.35);\n  --glow-orchid: 0 0 40px rgba(219, 125, 204, 0.35);\n  --glow-yellow: 0 0 40px rgba(255, 194, 3, 0.35);\n}\n\n/* ── SEMANTIC TYPE DEFAULTS ─────────────────────────────────────────────── */\nbody {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading);\n  font-weight: 800;\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n  color: var(--fg);\n}\n\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); font-weight: 700; }\nh4 { font-size: var(--fs-h4); font-weight: 700; letter-spacing: var(--ls-normal); }\n\np  { font-family: var(--font-body); line-height: var(--lh-body); color: var(--fg-muted); }\n\n/* Eyebrow — tiny uppercase label above a heading */\n.eyebrow {\n  font-family: var(--font-heading);\n  font-size: var(--fs-eyebrow);\n  font-weight: 700;\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--action);\n  margin: 0 0 12px;\n}\n\n/* Cherry Bomb — reserved for the \"bring the joy\" moment */\n.joy {\n  font-family: var(--font-decorative);\n  color: var(--spring-green);\n  line-height: 1.05;\n  font-weight: 400;\n}\n\n/* Focus */\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 3px;\n  border-radius: 4px;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: var(--amethyst); color: var(--text); }\n  * { box-sizing: border-box; }\n  a { color: var(--spring-green); }\n  .page { max-width: 880px; margin: 0 auto; padding: clamp(3rem,6vw,5rem) clamp(1.25rem,5vw,3rem) 6rem; }\n  .doc-eyebrow { font-family: \"Outfit\"; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--spring-green); margin: 0 0 14px; }\n  h1 { font-family: \"Outfit\"; font-weight: 800; font-size: clamp(2.2rem,5vw,3.2rem); letter-spacing: -0.025em; line-height: 1.06; margin: 0 0 1rem; }\n  .sub { font-family: \"Comfortaa\"; color: var(--text-muted); font-size: 1rem; line-height: 1.75; margin: 0 0 2.4rem; max-width: 640px; }\n  section.doc { padding: 2.4rem 0 2.6rem; border-top: 1px solid rgba(255,255,255,0.08); position: relative; }\n  section.doc > .rail { position: absolute; top: -1px; left: 0; width: 80px; height: 2px; background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); }\n  .block-eyebrow { font-family: \"Outfit\"; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }\n  h2 { font-family: \"Outfit\"; font-weight: 800; font-size: clamp(1.7rem,3.6vw,2.4rem); letter-spacing: -0.025em; line-height: 1.1; margin: 0 0 0.6rem; text-transform: lowercase; }\n  h3 { font-family: \"Outfit\"; font-weight: 700; font-size: 1.02rem; margin: 1.6rem 0 0.5rem; color: var(--text); text-transform: lowercase; letter-spacing: -0.005em; }\n  p, li { font-family: \"Comfortaa\"; font-size: 0.92rem; line-height: 1.8; color: var(--text-muted); }\n  p b, li b { color: var(--text); }\n  ul, ol { padding: 0 0 0 1.2rem; margin: 0 0 1rem; }\n  li { margin-bottom: 4px; }\n  .meta { font-family: \"Outfit\"; font-size: 11px; color: var(--text-subtle); margin: 0 0 1.5rem; letter-spacing: 0.05em; }\n  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; }\n  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); font-family: \"Comfortaa\"; font-size: 0.86rem; vertical-align: top; }\n  th { font-family: \"Outfit\"; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); }\n  td { color: var(--text-muted); }\n  .note { padding: 14px 18px; border-radius: 12px; background: rgba(255,194,3,0.06); border: 1px solid rgba(255,194,3,0.25); border-left: 3px solid var(--school-bus-yellow); font-family: \"Comfortaa\"; font-size: 0.86rem; color: var(--text); margin: 10px 0; }\n  .note b { color: var(--school-bus-yellow); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"page\">\n\n<p class=\"doc-eyebrow\">Legal Pages v1 · draft for review · 24 Apr 2026<\u002Fp>\n<h1>Three policies,<br><span style=\"color:var(--spring-green)\">rewritten.<\u002Fspan><\u002Fh1>\n<p class=\"sub\">Privacy rewritten against your actual processor list. Cookies rewritten to be concrete. Terms drafted from scratch. All in your lowercase-calm voice, with compliance substance underneath. Review for anything that doesn't sound like you — then I'll port to MDX at <code>content/legal/<\u002Fcode>.<\u002Fp>\n\n<div class=\"note\"><b>Legal note:<\u002Fb> these are drafts written by a designer with care, not a solicitor with a practicing certificate. Before going live, have a UK solicitor (or <a href=\"https://lawbite.co.uk\">LawBite<\u002Fa> / <a href=\"https://sparqa.com\">Sparqa<\u002Fa> at ~£150 fixed fee each) review. Nothing here is legal advice.<\u002Fdiv>\n\n<!-- ═══════════ PRIVACY ═══════════ -->\n<section class=\"doc\" style=\"--accent:#38ff99\">\n  <span class=\"rail\"><\u002Fspan>\n  <p class=\"block-eyebrow\">01 · privacy<\u002Fp>\n  <h2>privacy policy<\u002Fh2>\n  <p class=\"meta\">Last updated: 24 April 2026 · Version 2.0<\u002Fp>\n\n  <h3>our approach<\u002Fh3>\n  <p>unbarrier.me is designed to reduce friction, not create it — including when it comes to your data. we collect only what we need, use it with care, name every tool we pass it to, and never sell it. if you want the short version: one email if you subscribe, card details if you pay (handled by Stripe, we never see them), and anonymous page counts so we know which posts get read.<\u002Fp>\n\n  <h3>who we are<\u002Fh3>\n  <p>the data controller is <b>Unbarrier Education Ltd<\u002Fb> (Company No. 16603630), trading as Unbarrier.Me, registered in England and Wales. registered office: 45–47 The Triangle, Malmesbury, Wiltshire, SN16 0AH. contact: <a href=\"mailto:nici@unbarrier.me\">nici@unbarrier.me<\u002Fa>.<\u002Fp>\n\n  <h3>what we collect and why<\u002Fh3>\n  <table>\n    <thead><tr><th>What<\u002Fth><th>When<\u002Fth><th>Why (lawful basis)<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>Email address<\u002Ftd><td>You subscribe to the newsletter<\u002Ftd><td>Consent (UK GDPR Art. 6(1)(a))<\u002Ftd><\u002Ftr>\n      <tr><td>Name &amp; email<\u002Ftd><td>You book a session<\u002Ftd><td>Contract (Art. 6(1)(b))<\u002Ftd><\u002Ftr>\n      <tr><td>Payment info<\u002Ftd><td>You pay for a session<\u002Ftd><td>Contract — handled by Stripe, we never see card numbers<\u002Ftd><\u002Ftr>\n      <tr><td>Message content<\u002Ftd><td>You email us directly<\u002Ftd><td>Legitimate interest — replying to you<\u002Ftd><\u002Ftr>\n      <tr><td>Page-visit counts (anonymous)<\u002Ftd><td>You visit the site<\u002Ftd><td>Legitimate interest — improving the site<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <p>we do not collect sensitive personal data. we do not profile or advertise to you. we do not make automated decisions about you.<\u002Fp>\n\n  <h3>the tools we use (our processors)<\u002Fh3>\n  <p>we pass specific bits of your data to these services so the site and business can work. each has its own privacy policy:<\u002Fp>\n  <ul>\n    <li><b>MailerLite<\u002Fb> — newsletter delivery. Stores your email and subscription source. US-hosted under Standard Contractual Clauses.<\u002Fli>\n    <li><b>Stripe<\u002Fb> — payments. Handles card details entirely on their systems.<\u002Fli>\n    <li><b>Google Workspace<\u002Fb> — email (nici@unbarrier.me), calendar, bookings (Appointment Schedule), video (Meet). EU region where possible.<\u002Fli>\n    <li><b>Plausible Analytics<\u002Fb> — anonymous page-visit counts. Cookie-free, EU-hosted.<\u002Fli>\n    <li><b>Vercel<\u002Fb> — site hosting. Serves pages, logs basic request info.<\u002Fli>\n    <li><b>Xero<\u002Fb> — accounting. Holds invoice records as required by HMRC.<\u002Fli>\n    <li><b>WhatsApp<\u002Fb> — optional community group for Loop Breakers cohorts. You join voluntarily.<\u002Fli>\n  <\u002Ful>\n\n  <h3>how long we keep it<\u002Fh3>\n  <ul>\n    <li><b>Newsletter<\u002Fb> — until you unsubscribe, then deleted within 30 days.<\u002Fli>\n    <li><b>Session bookings &amp; invoices<\u002Fb> — 6 years (HMRC requirement).<\u002Fli>\n    <li><b>Direct emails<\u002Fb> — 2 years, then deleted unless part of an ongoing relationship.<\u002Fli>\n    <li><b>Analytics<\u002Fb> — anonymous; no individual retention.<\u002Fli>\n  <\u002Ful>\n\n  <h3>your rights<\u002Fh3>\n  <p>under UK GDPR you can: access the data we hold about you, ask us to correct it, ask us to delete it, withdraw consent, or complain to the <a href=\"https://ico.org.uk\">ICO<\u002Fa>. email <a href=\"mailto:nici@unbarrier.me\">nici@unbarrier.me<\u002Fa> — we'll respond within 30 days.<\u002Fp>\n\n  <h3>children<\u002Fh3>\n  <p>this service is for adults. we don't knowingly collect data from anyone under 16. if a child has submitted data, email us and we'll delete it.<\u002Fp>\n\n  <h3>changes<\u002Fh3>\n  <p>when this policy changes meaningfully, we'll update the date at the top and — if you're on the newsletter — mention it in the next letter.<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══════════ COOKIES ═══════════ -->\n<section class=\"doc\" style=\"--accent:#69d9d1\">\n  <span class=\"rail\"><\u002Fspan>\n  <p class=\"block-eyebrow\">02 · cookies<\u002Fp>\n  <h2>cookies &amp; tracking<\u002Fh2>\n  <p class=\"meta\">Last updated: 24 April 2026 · Version 2.0<\u002Fp>\n\n  <h3>the short version<\u002Fh3>\n  <p>this site sets <b>no tracking cookies<\u002Fb>. we use Plausible for analytics, which doesn't use cookies or collect personal data. you don't need to click a banner. there isn't one.<\u002Fp>\n\n  <h3>what cookies are<\u002Fh3>\n  <p>small text files some websites store on your device. they can be useful (remembering a login) or invasive (following you across sites). we don't use the invasive kind.<\u002Fp>\n\n  <h3>what this site sets<\u002Fh3>\n  <table>\n    <thead><tr><th>Cookie<\u002Fth><th>Purpose<\u002Fth><th>Duration<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td>None from us<\u002Ftd><td>—<\u002Ftd><td>—<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n  <p>that table is not a joke. unbarrier.me itself sets no cookies.<\u002Fp>\n\n  <h3>what other services might set, on their own pages<\u002Fh3>\n  <ul>\n    <li><b>Stripe checkout<\u002Fb> — when you click \"book\" and are taken to Stripe's page, Stripe sets its own cookies for payment security. these are on <code>stripe.com<\u002Fcode>, not unbarrier.me.<\u002Fli>\n    <li><b>Google booking<\u002Fb> — when you pick a session time via Google Appointment Schedule, you're on Google's domain. their cookies, their policy.<\u002Fli>\n    <li><b>YouTube / Vimeo<\u002Fb> — if we ever embed a video, those may set cookies. currently we don't embed any.<\u002Fli>\n  <\u002Ful>\n\n  <h3>analytics — Plausible<\u002Fh3>\n  <p>we use <a href=\"https://plausible.io\">Plausible<\u002Fa> to count page visits. it's cookie-free, privacy-respecting, and doesn't identify you. it counts things like \"247 people read the vision page this week\" — never \"Jane Doe visited at 14:03\". full details in their <a href=\"https://plausible.io/data-policy\">data policy<\u002Fa>.<\u002Fp>\n\n  <h3>managing cookies in general<\u002Fh3>\n  <p>you can block, clear, or manage cookies in your browser settings. here's <a href=\"https://www.aboutcookies.org\">aboutcookies.org<\u002Fa> for step-by-step guides. since we don't set any, this won't affect how unbarrier.me works — but it's a good habit.<\u002Fp>\n<\u002Fsection>\n\n<!-- ═══════════ TERMS ═══════════ -->\n<section class=\"doc\" style=\"--accent:#ffc203\">\n  <span class=\"rail\"><\u002Fspan>\n  <p class=\"block-eyebrow\">03 · terms<\u002Fp>\n  <h2>terms of service<\u002Fh2>\n  <p class=\"meta\">Last updated: 24 April 2026 · Version 1.0<\u002Fp>\n\n  <h3>the deal, short version<\u002Fh3>\n  <p>if you book a session, you're agreeing to these terms. they're plain-English on purpose. if anything here is unclear, email <a href=\"mailto:nici@unbarrier.me\">nici@unbarrier.me<\u002Fa> before booking — not after.<\u002Fp>\n\n  <h3>who we are<\u002Fh3>\n  <p><b>Unbarrier Education Ltd<\u002Fb> (Company No. 16603630), trading as Unbarrier.Me. registered office: 45–47 The Triangle, Malmesbury, Wiltshire, SN16 0AH. contact: <a href=\"mailto:nici@unbarrier.me\">nici@unbarrier.me<\u002Fa>.<\u002Fp>\n\n  <h3>what we offer<\u002Fh3>\n  <ul>\n    <li><b>Loop Breakers sessions<\u002Fb> — small-group or 1:1 coaching, 90-minute format, delivered via Google Meet.<\u002Fli>\n    <li><b>Unbarrier services<\u002Fb> — audit, access, and voice consultancy packages described on the site.<\u002Fli>\n    <li><b>Writing &amp; community<\u002Fb> — free newsletter, blog posts, WhatsApp cohort spaces.<\u002Fli>\n  <\u002Ful>\n\n  <h3>booking &amp; payment<\u002Fh3>\n  <ul>\n    <li>you book via Google Appointment Schedule. prices are shown at the point of booking.<\u002Fli>\n    <li>payment is taken via Stripe at booking, unless otherwise agreed.<\u002Fli>\n    <li>invoices for services are issued separately via Xero.<\u002Fli>\n    <li>all prices are in GBP unless stated. we are not VAT-registered at the time of writing.<\u002Fli>\n  <\u002Ful>\n\n  <h3>cancellation, rescheduling, refunds<\u002Fh3>\n  <ul>\n    <li><b>48+ hours before<\u002Fb> — full refund, or reschedule free. email us.<\u002Fli>\n    <li><b>24–48 hours before<\u002Fb> — 50% refund, or reschedule with no fee.<\u002Fli>\n    <li><b>Less than 24 hours<\u002Fb> — no refund, but we'll reschedule once as a goodwill gesture where possible.<\u002Fli>\n    <li><b>No-show<\u002Fb> — no refund. we'll still reach out to check you're ok.<\u002Fli>\n    <li><b>If we cancel<\u002Fb> — full refund or reschedule, your choice.<\u002Fli>\n  <\u002Ful>\n  <p>neurodivergent reality check: if you're mid-meltdown, mid-crisis, or genuinely can't make it for reasons outside your control, email us. we're human and we read context.<\u002Fp>\n\n  <h3>what sessions are, and aren't<\u002Fh3>\n  <ul>\n    <li>coaching and consultancy sessions are <b>not therapy<\u002Fb> and <b>not clinical advice<\u002Fb>. if you need mental-health support, see your GP, a registered therapist, or the <a href=\"https://www.samaritans.org\">Samaritans<\u002Fa> (call 116 123 any time).<\u002Fli>\n    <li>educational consultancy is not a substitute for statutory SEND assessment or legal advice.<\u002Fli>\n    <li>we don't guarantee specific outcomes — coaching supports your work, it doesn't do it for you.<\u002Fli>\n  <\u002Ful>\n\n  <h3>intellectual property<\u002Fh3>\n  <ul>\n    <li>worksheets, templates, written materials and recordings we provide remain our copyright. you may use them personally; please don't republish or resell without permission.<\u002Fli>\n    <li>anything you create using our tools is yours.<\u002Fli>\n    <li>testimonials you give us may be quoted (with your name or anonymously — your choice) on the site and in marketing.<\u002Fli>\n  <\u002Ful>\n\n  <h3>confidentiality &amp; safeguarding<\u002Fh3>\n  <ul>\n    <li>what's shared in sessions stays in sessions. we don't share your content with other clients.<\u002Fli>\n    <li>exception: if we believe you or someone else is at serious risk, we may break confidentiality to get appropriate support. we'll tell you if we do.<\u002Fli>\n    <li>group sessions: we ask all participants to respect the same principle. we can't guarantee other participants' behaviour — but we will address it.<\u002Fli>\n  <\u002Ful>\n\n  <h3>accessibility<\u002Fh3>\n  <p>we build the site to WCAG 2.2 AA. sessions can be adjusted for sensory, cognitive, or access needs — just tell us what works. see our <a href=\"/legal/accessibility\">accessibility statement<\u002Fa>.<\u002Fp>\n\n  <h3>limitation of liability<\u002Fh3>\n  <p>we take care in what we do, but we're a microbusiness and our liability is limited. we're not liable for: indirect or consequential losses, loss of profits, or things outside our reasonable control. nothing in these terms limits our liability for death, personal injury caused by negligence, or fraud — things the law doesn't let us limit.<\u002Fp>\n\n  <h3>governing law<\u002Fh3>\n  <p>these terms are governed by the laws of England and Wales. disputes will be resolved in the courts of England and Wales. before going to court, let's talk — email first, we mean it.<\u002Fp>\n\n  <h3>changes<\u002Fh3>\n  <p>we may update these terms. if they change materially, we'll notify existing clients by email and update the date above.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
